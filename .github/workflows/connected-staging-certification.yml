name: connected-staging-certification

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Attested release image tag/digest reference"
        required: true
      run_connected_tests:
        description: "Run connected staging certification"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONPATH: backend/src

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require resolver-generated frontend lockfile
        run: test -f frontend/package-lock.json
      - name: Compile and run cumulative backend regression
        run: |
          python -m compileall -q backend/src backend/tests backend/scripts
          python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Connected staging static preflight
        run: python backend/scripts/run_staging_preflight.py
      - name: Render staging manifests
        run: kubectl kustomize infra/k8s/staging > /tmp/deskpilot-staging.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: staging-preflight
          path: |
            backend/staging/reports/STAGING_PREFLIGHT.json
            /tmp/deskpilot-staging.yaml

  connected-staging:
    if: ${{ inputs.run_connected_tests == true }}
    needs: preflight
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure staging kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.DESKPILOT_STAGING_KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Verify staging namespace
        run: kubectl get namespace deskpilot-staging
      - name: Apply production-like staging overlay
        run: kubectl apply -k infra/k8s/staging
      - name: Wait for rollout
        run: |
          kubectl -n deskpilot-staging rollout status deployment/deskpilot-api --timeout=5m
          kubectl -n deskpilot-staging rollout status deployment/deskpilot-frontend --timeout=5m
          kubectl -n deskpilot-staging rollout status deployment/deskpilot-worker --timeout=5m
      - name: Require collected connected evidence
        run: |
          test -f backend/staging/evidence/connected-staging-evidence.json
          python backend/scripts/run_connected_staging_certification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-connected-staging-certificate
          path: |
            backend/staging/evidence/
            backend/staging/reports/
