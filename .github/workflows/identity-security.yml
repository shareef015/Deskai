name: Identity Security Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  identity-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install identity test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile identity core
        run: python -m compileall -q src
      - name: Deterministic authentication attack/regression suite
        run: python -m unittest discover -s tests -v

  browser-identity-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm run test:identity
