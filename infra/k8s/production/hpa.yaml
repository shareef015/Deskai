apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deskpilot-api
  namespace: deskpilot-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deskpilot-api
  minReplicas: 4
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deskpilot-worker
  namespace: deskpilot-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deskpilot-worker
  minReplicas: 3
  maxReplicas: 16
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
