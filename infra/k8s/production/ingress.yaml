apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deskpilot-production
  namespace: deskpilot-production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts: ["deskpilot.example.invalid"]
      secretName: deskpilot-production-tls
  rules:
    - host: deskpilot.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deskpilot-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deskpilot-frontend
                port:
                  name: http
