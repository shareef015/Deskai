apiVersion: apps/v1
kind: Deployment
metadata:
  name: deskpilot-api
  namespace: deskpilot-staging
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: deskpilot-api
  template:
    metadata:
      labels:
        app: deskpilot-api
        app.kubernetes.io/name: deskpilot-ai
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: deskpilot-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.example.invalid/deskpilot-api:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: deskpilot-config
            - secretRef:
                name: deskpilot-runtime-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deskpilot-api
  namespace: deskpilot-staging
  automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: deskpilot-api
  namespace: deskpilot-staging
spec:
  selector:
    app: deskpilot-api
  ports:
    - name: http
      port: 80
      targetPort: http
