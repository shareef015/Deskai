apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deskpilot-api
  namespace: deskpilot-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deskpilot-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deskpilot-worker
  namespace: deskpilot-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deskpilot-worker
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
