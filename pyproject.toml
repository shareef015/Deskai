[project]
name = "deskpilot-ai"
version = "0.1.0"
description = "Private Windows IT service desk and governed remediation platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pip-audit>=2.7,<3", "pre-commit>=3.7,<5", "pytest>=8,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["apps/web", "data/synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
